# This workflow builds a Java project with Maven and caches dependencies 
# to improve workflow execution time.
# For more information, see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: maven

      
      - name: Start MySQL container
        run: |
          docker run --name mysql5 \
            -e MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
            -e MYSQL_DATABASE=employee_management_application \
            -e MYSQL_USER=${{ secrets.MYSQL_USER }} \
            -e MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
            -p 3307:3306 \
            -d mysql:5.7

      
      - name: Cache Maven and SonarCloud packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            ~/.sonar/cache
          key: ${{ runner.os }}-maven-sonar-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-sonar

      
      - name: Build, Test, and Analyze with Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: |
          mvn verify -Pjacoco,mutation-testing,coveralls \
          -Dsonar.projectKey=WahidiBilal_employee_management_application \
          -DrepoToken=${{ secrets.COVERALLS_REPO_TOKEN }} \
          -DpullRequest=${{ github.event.pull_request.number }} \
          org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar

